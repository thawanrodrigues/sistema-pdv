<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- ── PWA Meta Tags ──────────────────────────────────────── -->
    <meta name="application-name" content="PDV Conecta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PDV Conecta" />
    <meta name="description" content="Sistema de Ponto de Venda — Conecta Sistemas" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- ── Manifest ───────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Ícones ─────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/pwa-icon-512.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/images/pwa-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/pwa-icon-512.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/images/pwa-icon-512.png" />

    <!-- ── Apple Splash Screens ──────────────────────────────── -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>PDV — Conecta Sistemas</title>

    <style>
      /* Previne flash de fundo branco durante carregamento */
      html, body { background-color: #0f172a; margin: 0; padding: 0; }
      #pwa-splash {
        position: fixed; inset: 0;
        background: #0f172a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease;
      }
      #pwa-splash.hidden { opacity: 0; pointer-events: none; }
      #pwa-splash h1 { color: #fff; font-size: 2rem; font-weight: 900; margin: 0; letter-spacing: -1px; }
      #pwa-splash p  { color: #f59e0b; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; margin: 8px 0 0; text-transform: uppercase; }
      .spinner {
        width: 40px; height: 40px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 32px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash screen enquanto o app carrega -->
    <div id="pwa-splash">
      <h1>CONECTA SISTEMAS</h1>
      <p>Soluções para sua empresa</p>
      <div class="spinner"></div>
    </div>

    <!-- Root do React Native Web -->
    <div id="root"></div>

    <script>
      // ── Registra o Service Worker ────────────────────────────
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('[PWA] Service Worker registrado:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }

      // ── Esconde splash quando o app React estiver pronto ────
      window.__pdvHideSplash = function () {
        var splash = document.getElementById('pwa-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 500);
        }
      };

      // Fallback: esconde após 5 segundos no máximo
      setTimeout(function () {
        if (window.__pdvHideSplash) window.__pdvHideSplash();
      }, 5000);

      // ── Prompt de instalação PWA ─────────────────────────────
      var deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredInstallPrompt = e;
        // Dispara evento customizado para o React poder mostrar o botão
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });

      window.__pdvInstall = function () {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          deferredInstallPrompt.userChoice.then(function (result) {
            console.log('[PWA] Resultado da instalação:', result.outcome);
            deferredInstallPrompt = null;
          });
        }
      };
    </script>
  </body>
</html>
